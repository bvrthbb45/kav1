<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kav1 - שליטה ומיקומים</title>
  <link rel="stylesheet" href="static/css/kav1.css?v=20261101">
  <style>
    .split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
    @media (max-width: 960px) { .split { grid-template-columns: 1fr; } }
    .stage { position: relative; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; line-height: 0; display: inline-block; max-width: 100%; }
    .stage img { display: block; max-width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
    .stage.placing { outline: 3px dashed var(--accent); cursor: crosshair; }
    .pt { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--danger); border: 2px solid #fff; transform: translate(-50%, -50%); cursor: pointer; }
    .pt.sel { background: var(--accent); width: 18px; height: 18px; }
    .pt span { position: absolute; top: 16px; right: 0; white-space: nowrap; font-size: 12px; line-height: 1.3; background: rgba(0,0,0,0.8); color: #fff; padding: 1px 6px; border-radius: 4px; }
    .tbl-wrap { overflow-x: auto; }
    tr.sel td { background: #2f3b4d; }
    tr.clickable { cursor: pointer; }
    .wrap { flex-wrap: wrap; }
    .sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    h3.sec { font-size: 15px; margin: 0 0 10px; color: var(--text-bright); font-weight: 600; }
    .pinbar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; margin-bottom: 12px; }
    .pinbar label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 3px; }
    .pinbar .fld { flex: 1; min-width: 130px; }
    .chip { display: inline-block; background: rgba(58,123,213,0.18); color: #7aa9e8; border-radius: 12px; padding: 1px 9px; font-size: 12px; margin: 2px 0 0 4px; }
    .notice { background: rgba(216,169,58,0.15); border: 1px solid rgba(216,169,58,0.5); color: #e6bf62; border-radius: var(--radius); padding: 8px 12px; font-size: 13px; margin-bottom: 10px; }
    .pool-table td input[type=text] { min-width: 110px; }
    .full { display: grid; gap: 16px; margin-top: 16px; }
  </style>
</head>
<body>
  <div x-data="locationsPage()" x-init="init()" x-cloak>

    <div class="topbar">
      <div class="brand">
        <span class="logo" x-text="brand.logo_text || 'K1'"></span>
        <span x-text="brand.system_name || 'Kav1'"></span>
      </div>
      <nav>
        <a x-show="can('control.panel') || can('visitor.entry_exit')" href="index.html">פאנל שליטה</a>
        <a x-show="can('visitor.view')" href="visitors.html">מבקרים</a>
        <a x-show="can('logs.view')" href="logs.html">לוגים</a>
        <a x-show="can('reports.view')" href="reports.html">דוחות</a>
        <a x-show="can('roles.manage') || can('users.view') || can('admin.dashboard')" href="admin/index.html">ניהול</a>
      </nav>
      <div class="user-area">
        <span x-text="me ? (me.full_name || me.username) : ''"></span>
        <span class="muted" x-text="me ? '· ' + me.role_name : ''"></span>
        <button class="btn btn-sm btn-ghost" @click="Kav1.logout()">יציאה</button>
      </div>
    </div>

    <div class="page">
      <div class="page-head">
        <h1>שליטה ומיקומים</h1>
        <div class="row">
          <span class="badge badge-active" x-text="canManage() ? 'ניהול פאנל' : 'הפעלה'"></span>
          <select x-model="projFilter" x-effect="$nextTick(() => $el.value = projFilter)" style="width:190px;">
            <option value="">כל הפרויקטים</option>
            <template x-for="p in projectNames" :key="p"><option :value="p" x-text="p"></option></template>
          </select>
        </div>
      </div>

      <template x-if="loaded && !enabled">
        <div class="empty-state"><p>הפיצ'ר "שליטה ומיקומים" אינו מופעל. מנהל המערכת יכול להפעיל אותו במסך ההגדרות.</p></div>
      </template>

      <template x-if="loaded && enabled">
        <div>
          <div class="split">
            <!-- ===== map and pinning ===== -->
            <div class="card">
              <h3 class="sec">מפה ונעיצת מלווים לפי פרויקט</h3>

              <div class="row wrap" style="margin-bottom:10px;">
                <select x-model.number="mapId" x-effect="$nextTick(() => $el.value = mapId)" style="width:180px;" @change="placing = null">
                  <template x-for="m in maps" :key="m.id"><option :value="m.id" x-text="m.name"></option></template>
                </select>
                <template x-if="canManage() && mapId">
                  <div class="row wrap">
                    <button class="btn btn-sm" @click="renameMap()">שינוי שם</button>
                    <button class="btn btn-sm btn-danger" @click="deleteMap()">מחיקת מפה</button>
                  </div>
                </template>
              </div>
              <template x-if="canManage()">
                <div class="row wrap" style="margin-bottom:10px;">
                  <input type="file" accept="image/png,image/jpeg" @change="onFile($event)" style="font-size:13px;width:auto;">
                  <input type="text" x-model="newMapName" placeholder="שם למפה" style="width:150px;">
                  <button class="btn btn-primary btn-sm" @click="uploadMap()" :disabled="!file">העלאת מפה</button>
                </div>
              </template>
              <p x-show="msg" x-text="msg" :style="'font-size:13px;margin:0 0 10px;color:' + (msgErr ? 'var(--danger)' : 'var(--success)')"></p>

              <div class="notice" x-show="!mapId">
                אין מפה במערכת, ולכן אי אפשר לנעוץ.
                <span x-show="canManage()">אפשר להעלות מפה (PNG או JPEG) למעלה.</span>
                <span x-show="!canManage()">מי שיש לו הרשאת "ניהול פאנל" צריך להעלות מפה.</span>
              </div>

              <!-- the pin bar: project (from the control panel) + escort (from the pool) then click the map -->
              <div class="pinbar">
                <div class="row wrap" style="align-items:flex-end;">
                  <div class="fld">
                    <label>פרויקט (מפאנל השליטה)</label>
                    <select x-model="pin.project" x-effect="$nextTick(() => $el.value = pin.project)">
                      <option value="">בחר פרויקט</option>
                      <template x-for="p in projectOptions" :key="p.project">
                        <option :value="p.project" x-text="p.label"></option>
                      </template>
                    </select>
                  </div>
                  <div class="fld">
                    <label>מלווה (מהפול)</label>
                    <select x-model.number="pin.escortId" x-effect="$nextTick(() => $el.value = pin.escortId)">
                      <option value="">בחר מלווה</option>
                      <template x-for="p in activePool" :key="p.id"><option :value="p.id" x-text="escortLabel(p)"></option></template>
                    </select>
                  </div>
                  <button class="btn btn-primary" @click="startPin()" :disabled="!mapId" x-text="placing ? 'לחץ על המפה...' : '📍 נעץ על המפה'"></button>
                </div>
                <p class="muted" style="font-size:12px;margin:8px 0 0;" x-text="hint"></p>
              </div>

              <template x-if="mapId">
                <div class="stage" :class="placing ? 'placing' : ''" @click="onStage($event)">
                  <img :src="'/locations/maps/' + mapId + '/image'" alt="" x-ref="img">
                  <template x-for="e in mapEntries" :key="e.id">
                    <div class="pt" :class="e.id === selId ? 'sel' : ''" :style="'left:' + (e.x * 100) + '%;top:' + (e.y * 100) + '%'"
                         @click.stop="select(e.id)"><span x-text="e.project + (e.escort_name ? ' · ' + e.escort_name : '')"></span></div>
                  </template>
                </div>
              </template>
            </div>

            <!-- ===== placements ===== -->
            <div class="card">
              <h3 class="sec">הצבות לפי פרויקט</h3>
              <p class="muted" style="font-size:12px;margin:-4px 0 10px;">כל פרויקט מופיע פעם אחת. המיקום נקבע לפי הנעיצה על המפה. נעיצה חדשה לאותו פרויקט ומלווה מזיזה את הנקודה הקיימת.</p>
              <p x-show="entMsg" x-text="entMsg" style="font-size:13px;margin:0 0 10px;color:var(--danger);"></p>
              <div class="tbl-wrap">
                <table class="data">
                  <thead><tr><th>מלווה</th><th>נקודה על המפה</th><th></th></tr></thead>
                  <tbody>
                    <template x-for="r in rows" :key="r.__g ? 'g:' + r.key : r.id">
                      <tr :class="(r.__g ? 'grp-row' : 'clickable') + (r.id === selId ? ' sel' : '')" @click="r.__g ? toggle(r.key) : select(r.id)">
                        <td :class="r.__g ? 'grp-cell' : ''" :colspan="r.__g ? 3 : 1">
                          <span x-show="r.__g" x-text="r.__g ? (collapsed[r.key] ? '◀ ' : '▼ ') + r.title + ' (' + r.count + ')' : ''"></span>
                          <template x-if="!r.__g">
                            <div @click.stop>
                              <select x-model.number="r.escort_id" x-effect="$nextTick(() => $el.value = r.escort_id == null ? '' : r.escort_id)" @change="onPick(r)">
                                <option value="">טקסט חופשי</option>
                                <template x-for="p in optionsFor(r)" :key="p.id"><option :value="p.id" x-text="p.name + (p.active ? '' : ' (לא פעיל)')"></option></template>
                              </select>
                              <input type="text" x-show="!r.escort_id" x-model="r.escort_name" maxlength="200" placeholder="שם מלווה" style="margin-top:4px;">
                              <div class="sub" x-show="r.escort_id" x-text="[r.escort_phone, r.escort_catalog ? 'מס׳ קטלוגי ' + r.escort_catalog : ''].filter(Boolean).join(' · ')"></div>
                            </div>
                          </template>
                        </td>
                        <template x-if="!r.__g"><td x-text="r.x == null ? '—' : '✔'"></td></template>
                        <template x-if="!r.__g"><td>
                            <div class="row wrap">
                              <button class="btn btn-sm" @click.stop="repin(r)" :disabled="!mapId" x-text="r.x == null ? '📍 נעץ' : '📍 הזז'"></button>
                              <button class="btn btn-sm" @click.stop="clearPoint(r)" x-show="r.x != null">הסר נקודה</button>
                              <button class="btn btn-sm" @click.stop="saveEntry(r)">שמירה</button>
                              <button class="btn btn-sm btn-danger" @click.stop="removeEntry(r)">מחיקה</button>
                            </div>
                        </td></template>
                      </tr>
                    </template>
                  </tbody>
                </table>
                <template x-if="rows.length === 0"><p class="muted" style="text-align:center;">אין הצבות עדיין. בחר פרויקט ומלווה, ולחץ "נעץ על המפה".</p></template>
              </div>
            </div>
          </div>

          <div class="full">
            <!-- ===== escorts <-> contractors ===== -->
            <div class="card">
              <h3 class="sec">שיוך מלווים לקבלנים (לפי פאנל השליטה)</h3>
              <div class="row wrap" style="margin-bottom:10px;align-items:flex-end;">
                <div style="min-width:220px;">
                  <label class="muted" style="font-size:12px;display:block;margin-bottom:3px;">פרויקט</label>
                  <select x-model="cProject" x-effect="$nextTick(() => $el.value = cProject)" @change="loadContractors()">
                    <option value="">בחר פרויקט</option>
                    <template x-for="p in projectOptions" :key="p.project"><option :value="p.project" x-text="p.label"></option></template>
                  </select>
                </div>
                <label class="checkbox-row" style="color:var(--text);"><input type="checkbox" x-model="cInside" @change="loadContractors()"> רק מי שבפנים כרגע</label>
                <div style="min-width:200px;">
                  <label class="muted" style="font-size:12px;display:block;margin-bottom:3px;">שייך מלווה לכל הקבלנים המוצגים</label>
                  <select x-model.number="bulkEscort" x-effect="$nextTick(() => $el.value = bulkEscort)">
                    <option value="">בחר מלווה</option>
                    <template x-for="p in activePool" :key="p.id"><option :value="p.id" x-text="escortLabel(p)"></option></template>
                  </select>
                </div>
                <button class="btn btn-primary btn-sm" @click="assignAll()" :disabled="!cProject || !bulkEscort">שייך לכולם</button>
              </div>
              <p x-show="asgMsg" x-text="asgMsg" :style="'font-size:13px;margin:0 0 10px;color:' + (asgErr ? 'var(--danger)' : 'var(--success)')"></p>
              <template x-if="!cProject"><p class="muted">בחר פרויקט כדי לראות את הקבלנים שלו מפאנל השליטה.</p></template>
              <div class="tbl-wrap" x-show="cProject">
                <table class="data">
                  <thead><tr><th>קבלן</th><th>מספר זיהוי</th><th>סטטוס</th><th>מלווה</th></tr></thead>
                  <tbody>
                    <template x-for="c in contractors" :key="c.dbid">
                      <tr>
                        <td x-text="c.name"></td>
                        <td x-text="c.visitorid"></td>
                        <td><span class="badge" :class="c.inside ? 'badge-in' : 'badge-out'" x-text="c.inside ? 'בפנים' : 'בחוץ'"></span></td>
                        <td>
                          <select x-model.number="c.escort_id" x-effect="$nextTick(() => $el.value = c.escort_id == null ? '' : c.escort_id)" @change="assignOne(c)">
                            <option value="">ללא מלווה</option>
                            <template x-for="p in contractorOptions(c)" :key="p.id"><option :value="p.id" x-text="escortLabel(p) + (p.active ? '' : ' (לא פעיל)')"></option></template>
                          </select>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
                <template x-if="contractors.length === 0"><p class="muted" style="text-align:center;">אין קבלנים להצגה בפרויקט הזה.</p></template>
              </div>
            </div>

            <!-- ===== escort pool ===== -->
            <div class="card">
              <h3 class="sec">פול מלווים</h3>
              <div class="row wrap" style="margin-bottom:10px;">
                <input type="text" x-model="pName" placeholder="שם" style="flex:2;min-width:110px;">
                <input type="text" x-model="pCat" placeholder="מספר קטלוגי" dir="ltr" style="flex:1;min-width:90px;">
                <input type="text" x-model="pPhone" placeholder="טלפון" dir="ltr" style="flex:1;min-width:100px;">
                <button class="btn btn-primary btn-sm" @click="addEscort()">הוסף לפול</button>
              </div>
              <p x-show="poolMsg" x-text="poolMsg" :style="'font-size:13px;margin:0 0 10px;color:' + (poolErr ? 'var(--danger)' : 'var(--success)')"></p>
              <div class="tbl-wrap pool-table">
                <table class="data">
                  <thead><tr><th>שם</th><th>מספר קטלוגי</th><th>טלפון</th><th>משויך לפרויקטים</th><th>מצב</th><th></th></tr></thead>
                  <tbody>
                    <template x-for="p in pool" :key="p.id">
                      <tr>
                        <td><input type="text" x-model="p.name" maxlength="200"></td>
                        <td><input type="text" x-model="p.catalog_number" maxlength="50" dir="ltr"></td>
                        <td><input type="text" x-model="p.phone" maxlength="30" dir="ltr"></td>
                        <td>
                          <template x-for="pr in p.projects" :key="pr.project"><span class="chip" x-text="pr.project + ' (' + pr.contractors + ')'"></span></template>
                          <span class="muted" x-show="!p.projects || p.projects.length === 0">לא משויך</span>
                        </td>
                        <td><span class="badge" :class="p.active ? 'badge-in' : 'badge-out'" x-text="p.active ? 'פעיל' : 'לא פעיל'"></span></td>
                        <td>
                          <div class="row">
                            <button class="btn btn-sm" @click="saveEscort(p)">שמירה</button>
                            <button class="btn btn-sm" @click="p.active = !p.active; saveEscort(p)" x-text="p.active ? 'השבתה' : 'הפעלה'"></button>
                            <button class="btn btn-sm btn-danger" @click="removeEscort(p)">מחיקה</button>
                          </div>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
                <template x-if="pool.length === 0"><p class="muted" style="text-align:center;">הפול ריק. אפשר להוסיף מלווים למעלה.</p></template>
              </div>
              <p class="muted" style="font-size:12px;margin:8px 0 0;">מלווה ששויך (להצבה או לקבלן) לא נמחק אלא מושבת, והשיוך נשמר. ליד כל מלווה מופיעים הפרויקטים שאליהם הוא משויך, ובסוגריים מספר הקבלנים.</p>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <script src="static/js/kav1.js?v=20261101"></script>
  <script>
    function locationsPage() {
      return {
        Kav1, me: null, brand: {}, loaded: false, enabled: false,
        maps: [], entries: [], pool: [], projects: [], mapId: null, selId: null,
        placing: null,                       // null | {mode: "new"} | {mode: "entry", id}
        projFilter: "", collapsed: {},
        hint: "בחר פרויקט ומלווה, לחץ \"נעץ על המפה\" ואז לחץ על המקום במפה.",
        pin: { project: "", escortId: "" },
        file: null, newMapName: "", msg: "", msgErr: false, entMsg: "",
        cProject: "", cInside: true, contractors: [], bulkEscort: "", asgMsg: "", asgErr: false,
        pName: "", pCat: "", pPhone: "", poolMsg: "", poolErr: false,

        can(perm) { return !!(this.me && this.me.permissions && this.me.permissions.includes(perm)); },
        canManage() { return this.can("locations.manage"); },                      // panel management
        canOperate() { return this.canManage() || this.can("locations.operate"); }, // operation

        get activePool() { return this.pool.filter(p => p.active); },
        // the projects of the control panel, each once (plus any project an old placement still uses)
        get projectOptions() {
          const list = this.projects.map(p => ({ project: p.project, label: p.project + " (" + p.contractors + " קבלנים" + (p.inside ? ", " + p.inside + " בפנים" : "") + ")" }));
          const known = new Set(list.map(p => p.project));
          this.entries.forEach(e => { if (!known.has(e.project)) { known.add(e.project); list.push({ project: e.project, label: e.project + " (אין קבלנים בפאנל)" }); } });
          return list;
        },
        get projectNames() { return this.projectOptions.map(p => p.project); },
        get selected() { return this.entries.find(e => e.id === this.selId) || null; },
        get mapEntries() { return this.entries.filter(e => e.map_id === this.mapId && e.x != null && (!this.projFilter || e.project === this.projFilter)); },
        get rows() {
          const list = this.entries.filter(e => !this.projFilter || e.project === this.projFilter);
          const groups = new Map();
          list.forEach(e => { if (!groups.has(e.project)) groups.set(e.project, []); groups.get(e.project).push(e); });
          const out = [];
          groups.forEach((members, k) => {
            out.push({ __g: true, key: k, title: k, count: members.length });
            if (!this.collapsed[k]) members.forEach(m => out.push(m));
          });
          return out;
        },
        escortLabel(p) { return p.name + (p.catalog_number ? " (" + p.catalog_number + ")" : ""); },
        // active escorts, plus the one this row already has (even if it was deactivated since)
        optionsFor(r) { return this.pool.filter(p => p.active || p.id === r.escort_id); },
        contractorOptions(c) { return this.pool.filter(p => p.active || p.id === c.escort_id); },

        async init() {
          try { this.me = await Kav1.me(); } catch (e) { location.href = "/login.html"; return; }
          if (!this.canOperate()) { location.href = "/index.html"; return; }
          try { this.brand = await Kav1.get("auth/branding"); } catch (e) {}
          const flags = await Kav1.extras.flags();
          this.enabled = !!flags.locations_enabled;
          if (this.enabled) await this.refresh();
          this.loaded = true;
        },

        async refresh() {
          try {
            [this.maps, this.entries, this.pool, this.projects] = await Promise.all([
              Kav1.get("locations/maps"), Kav1.get("locations/entries"),
              Kav1.get("locations/escorts?include_inactive=true"), Kav1.get("locations/projects"),
            ]);
            if (!this.maps.some(m => m.id === this.mapId)) this.mapId = this.maps.length ? this.maps[0].id : null;
            if (this.cProject) await this.loadContractors();
          } catch (e) { if (e.message !== "unauthorized") Kav1.toast(e.message, "error"); }
        },
        toggle(k) { this.collapsed = { ...this.collapsed, [k]: !this.collapsed[k] }; },
        select(id) { this.selId = id; },

        // ---- maps (panel management)
        onFile(ev) { this.file = ev.target.files[0] || null; },
        async uploadMap() {
          const f = this.file; if (!f) return;
          if (f.size > 15 * 1024 * 1024) { this.msgErr = true; this.msg = "הקובץ גדול מ-15MB"; return; }
          const name = (this.newMapName || f.name.replace(/\.[^.]+$/, "")).trim();
          try {
            const res = await fetch("/locations/maps?name=" + encodeURIComponent(name), { method: "POST", body: f, credentials: "same-origin" });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.detail || "ההעלאה נכשלה");
            this.msgErr = false; this.msg = "המפה הועלתה"; this.file = null; this.newMapName = "";
            await this.refresh(); this.mapId = data.id;
          } catch (e) { this.msgErr = true; this.msg = e.message; }
        },
        async renameMap() {
          const cur = this.maps.find(m => m.id === this.mapId); if (!cur) return;
          const n = window.prompt("שם חדש למפה:", cur.name); if (!n) return;
          try { await Kav1.put("locations/maps/" + this.mapId, { name: n }); await this.refresh(); } catch (e) { this.msgErr = true; this.msg = e.message; }
        },
        async deleteMap() {
          if (!this.mapId || !confirm("למחוק את המפה? הנקודות עליה יוסרו, השורות עצמן יישארו.")) return;
          try { await Kav1.del("locations/maps/" + this.mapId); await this.refresh(); } catch (e) { this.msgErr = true; this.msg = e.message; }
        },

        // ---- pinning
        startPin() {
          this.entMsg = "";
          if (!this.pin.project) { this.hint = "קודם בחר פרויקט."; return; }
          if (!this.pin.escortId) { this.hint = "קודם בחר מלווה מהפול."; return; }
          this.placing = { mode: "new" };
          this.hint = "לחץ על המפה במקום הרצוי (או לחץ שוב על הכפתור לביטול).";
        },
        repin(r) {
          this.selId = r.id; this.placing = { mode: "entry", id: r.id };
          this.hint = "לחץ על המפה במקום החדש של " + r.project + ".";
        },
        async onStage(ev) {
          if (!this.placing) return;
          const r = this.$refs.img.getBoundingClientRect();
          if (!r.width || !this.mapId) return;
          const x = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
          const y = Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height));
          const mode = this.placing; this.placing = null;
          this.hint = "בחר פרויקט ומלווה, לחץ \"נעץ על המפה\" ואז לחץ על המקום במפה.";
          if (mode.mode === "entry") {
            const e = this.entries.find(z => z.id === mode.id);
            if (e) await this.saveEntry(e, { map_id: this.mapId, x, y });
            return;
          }
          // a new pin: the same project + escort is the same placement, so it only moves
          const loc = "";
          const same = this.entries.find(e => e.project === this.pin.project && e.escort_id === this.pin.escortId);
          try {
            if (same) {
              await Kav1.put("locations/entries/" + same.id, this.body(same, { map_id: this.mapId, x, y }));
              this.selId = same.id;
            } else {
              const created = await Kav1.post("locations/entries", { project: this.pin.project, escort_id: this.pin.escortId, escort_name: "", location_text: loc, map_id: this.mapId, x, y });
              this.selId = created.id;
            }
            Kav1.toast("הנקודה נשמרה");
            await this.refresh();
          } catch (er) { this.entMsg = er.message; }
        },

        // ---- placements
        body(e, patch) {
          return { project: e.project, escort_id: e.escort_id || null, escort_name: e.escort_id ? "" : e.escort_name, location_text: e.location_text, map_id: e.map_id, x: e.x, y: e.y, ...patch };
        },
        onPick(r) { if (r.escort_id) { const p = this.pool.find(x => x.id === r.escort_id); if (p) { r.escort_phone = p.phone; r.escort_catalog = p.catalog_number; } } },
        async saveEntry(e, patch) {
          this.entMsg = "";
          try { await Kav1.put("locations/entries/" + e.id, this.body(e, patch || {})); Kav1.toast("נשמר"); await this.refresh(); }
          catch (er) { this.entMsg = er.message; await this.refresh(); }
        },
        clearPoint(e) { this.saveEntry(e, { map_id: null, x: null, y: null }); },
        async removeEntry(e) {
          if (!confirm("למחוק את ההצבה?")) return;
          try { await Kav1.del("locations/entries/" + e.id); await this.refresh(); } catch (er) { this.entMsg = er.message; }
        },

        // ---- escorts <-> contractors of the control panel
        async loadContractors() {
          if (!this.cProject) { this.contractors = []; return; }
          try { this.contractors = await Kav1.get("locations/contractors?project=" + encodeURIComponent(this.cProject) + "&inside_only=" + (this.cInside ? "true" : "false")); }
          catch (e) { this.contractors = []; this.asgErr = true; this.asgMsg = e.message; }
        },
        async assignOne(c) {
          try {
            await Kav1.put("locations/assignments", { visitor_dbid: c.dbid, escort_id: c.escort_id || null });
            this.asgErr = false; this.asgMsg = "נשמר";
            this.pool = await Kav1.get("locations/escorts?include_inactive=true");   // refresh the projects shown under each escort
          } catch (e) { this.asgErr = true; this.asgMsg = e.message; await this.loadContractors(); }
        },
        async assignAll() {
          try {
            const r = await Kav1.post("locations/assignments/bulk", { project: this.cProject, escort_id: this.bulkEscort || null, inside_only: this.cInside });
            this.asgErr = false; this.asgMsg = "שויך מלווה ל-" + r.updated + " קבלנים"; await this.refresh();
          } catch (e) { this.asgErr = true; this.asgMsg = e.message; }
        },

        // ---- escort pool
        poolSay(text, err) { this.poolMsg = text; this.poolErr = !!err; },
        async addEscort() {
          try {
            await Kav1.post("locations/escorts", { name: this.pName, catalog_number: this.pCat, phone: this.pPhone });
            this.pName = ""; this.pCat = ""; this.pPhone = ""; this.poolSay("נוסף לפול", false); await this.refresh();
          } catch (e) { this.poolSay(e.message, true); }
        },
        async saveEscort(p) {
          try {
            await Kav1.put("locations/escorts/" + p.id, { name: p.name, catalog_number: p.catalog_number || "", phone: p.phone || "", active: !!p.active });
            this.poolSay("נשמר", false); await this.refresh();
          } catch (e) { this.poolSay(e.message, true); await this.refresh(); }
        },
        async removeEscort(p) {
          if (!confirm("למחוק את " + p.name + " מהפול? מלווה ששויך יושבת במקום זאת.")) return;
          try {
            const r = await Kav1.del("locations/escorts/" + p.id);
            this.poolSay(r.detail === "deactivated" ? "המלווה משויך, ולכן הושבת (לא נמחק)" : "נמחק מהפול", false); await this.refresh();
          } catch (e) { this.poolSay(e.message, true); }
        },
      };
    }
  </script>
  <script src="static/vendor/alpine.min.js" defer></script>
</body>
</html>
