<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kav1 - שליטה ומיקומים</title>
  <link rel="stylesheet" href="static/css/kav1.css">
  <style>
    .split { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
    @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
    .stage { position: relative; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; line-height: 0; display: inline-block; max-width: 100%; }
    .stage img { display: block; max-width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
    .stage.placing { outline: 2px dashed var(--accent); cursor: crosshair; }
    .pt { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--danger); border: 2px solid #fff; transform: translate(-50%, -50%); cursor: pointer; }
    .pt.sel { background: var(--accent); width: 18px; height: 18px; }
    .pt span { position: absolute; top: 16px; right: 0; white-space: nowrap; font-size: 12px; line-height: 1.3; background: rgba(0,0,0,0.8); color: #fff; padding: 1px 6px; border-radius: 4px; }
    .tbl-wrap { overflow-x: auto; }
    tr.sel td { background: #2f3b4d; }
    tr.clickable { cursor: pointer; }
    .wrap { flex-wrap: wrap; }
  </style>
</head>
<body>
  <div x-data="locationsPage()" x-init="init()" x-cloak>

    <div class="topbar">
      <div class="brand">
        <span class="logo" x-text="brand.logo_text || 'K1'"></span>
        <span x-text="brand.system_name || 'Kav1'"></span>
      </div>
      <nav>
        <a x-show="can('control.panel') || can('visitor.entry_exit')" href="index.html">פאנל שליטה</a>
        <a x-show="can('visitor.view')" href="visitors.html">מבקרים</a>
        <a x-show="can('logs.view')" href="logs.html">לוגים</a>
        <a x-show="can('reports.view')" href="reports.html">דוחות</a>
        <a x-show="can('roles.manage') || can('users.view') || can('admin.dashboard')" href="admin/index.html">ניהול</a>
      </nav>
      <div class="user-area">
        <span x-text="me ? (me.full_name || me.username) : ''"></span>
        <span class="muted" x-text="me ? '· ' + me.role_name : ''"></span>
        <button class="btn btn-sm btn-ghost" @click="Kav1.logout()">יציאה</button>
      </div>
    </div>

    <div class="page">
      <div class="page-head">
        <h1>שליטה ומיקומים</h1>
        <div class="row">
          <select x-model="projFilter" style="width:170px;">
            <option value="">כל הפרויקטים</option>
            <template x-for="p in projects" :key="p"><option :value="p" x-text="p"></option></template>
          </select>
        </div>
      </div>

      <template x-if="loaded && !enabled">
        <div class="empty-state"><p>הפיצ'ר "שליטה ומיקומים" אינו מופעל. מנהל המערכת יכול להפעיל אותו במסך ההגדרות.</p></div>
      </template>

      <template x-if="loaded && enabled">
        <div class="split">
          <!-- map -->
          <div class="card">
            <div class="row wrap" style="margin-bottom:10px;">
              <select x-model.number="mapId" x-effect="$nextTick(() => $el.value = mapId)" style="width:180px;" @change="selectMap()">
                <template x-for="m in maps" :key="m.id"><option :value="m.id" x-text="m.name"></option></template>
              </select>
              <template x-if="canEdit()">
                <div class="row wrap">
                  <button class="btn btn-sm" @click="renameMap()" :disabled="!mapId">שינוי שם</button>
                  <button class="btn btn-sm btn-danger" @click="deleteMap()" :disabled="!mapId">מחיקת מפה</button>
                </div>
              </template>
            </div>
            <template x-if="canEdit()">
              <div class="row wrap" style="margin-bottom:10px;">
                <input type="file" accept="image/png,image/jpeg" @change="onFile($event)" style="font-size:13px;width:auto;">
                <input type="text" x-model="newMapName" placeholder="שם למפה" style="width:150px;">
                <button class="btn btn-primary btn-sm" @click="uploadMap()" :disabled="!file">העלאת מפה</button>
              </div>
            </template>
            <template x-if="canEdit()">
              <div class="row wrap" style="margin-bottom:10px;">
                <button class="btn btn-sm" @click="startPlace()" :disabled="!selected || !mapId">מקם נקודה לשורה שנבחרה</button>
                <button class="btn btn-sm" @click="clearPoint()" :disabled="!selected || selected.x == null">הסר נקודה</button>
                <span class="muted" style="font-size:12px;" x-text="hint"></span>
              </div>
            </template>
            <p x-show="msg" x-text="msg" :style="'font-size:13px;margin:0 0 10px;color:' + (msgErr ? 'var(--danger)' : 'var(--success)')"></p>
            <template x-if="mapId">
              <div class="stage" :class="placing ? 'placing' : ''" @click="onStage($event)" x-ref="stage">
                <img :src="'/locations/maps/' + mapId + '/image'" alt="" x-ref="img">
                <template x-for="e in mapEntries" :key="e.id">
                  <div class="pt" :class="e.id === selId ? 'sel' : ''" :style="'left:' + (e.x * 100) + '%;top:' + (e.y * 100) + '%'"
                       @click.stop="select(e.id)"><span x-text="e.project + (e.escort_name ? ' · ' + e.escort_name : '')"></span></div>
                </template>
              </div>
            </template>
            <template x-if="!mapId"><p class="muted">אין מפה להצגה.</p></template>
          </div>

          <!-- escorts and locations -->
          <div class="card">
            <template x-if="canEdit()">
              <div class="row wrap" style="margin-bottom:10px;">
                <input type="text" x-model="nProj" placeholder="פרויקט" list="locProjects" style="flex:1;min-width:90px;">
                <datalist id="locProjects"><template x-for="p in projects" :key="p"><option :value="p"></option></template></datalist>
                <input type="text" x-model="nEsc" placeholder="מלווה" style="flex:1;min-width:90px;">
                <input type="text" x-model="nLoc" placeholder="מיקום" style="flex:1;min-width:90px;">
                <button class="btn btn-primary btn-sm" @click="addEntry()">הוסף מלווה ומיקום</button>
              </div>
            </template>
            <p x-show="entMsg" x-text="entMsg" style="font-size:13px;margin:0 0 10px;color:var(--danger);"></p>
            <div class="tbl-wrap">
              <table class="data">
                <thead><tr><th>מלווה</th><th>מיקום</th><th>נקודה</th><th></th></tr></thead>
                <tbody>
                  <template x-for="r in rows" :key="r.__g ? 'g:' + r.key : r.id">
                    <tr :class="(r.__g ? 'grp-row' : 'clickable') + (r.id === selId ? ' sel' : '')" @click="r.__g ? toggle(r.key) : select(r.id)">
                      <td x-show="r.__g" colspan="4" x-text="r.__g ? (collapsed[r.key] ? '◀ ' : '▼ ') + r.title + ' (' + r.count + ')' : ''"></td>
                      <td x-show="!r.__g">
                        <template x-if="canEdit() && !r.__g"><input type="text" x-model="r.escort_name" maxlength="200" @click.stop></template>
                        <template x-if="!canEdit() && !r.__g"><span x-text="r.escort_name"></span></template>
                      </td>
                      <td x-show="!r.__g">
                        <template x-if="canEdit() && !r.__g"><input type="text" x-model="r.location_text" maxlength="200" @click.stop></template>
                        <template x-if="!canEdit() && !r.__g"><span x-text="r.location_text"></span></template>
                      </td>
                      <td x-show="!r.__g" x-text="r.x == null ? '—' : '✔'"></td>
                      <td x-show="!r.__g">
                        <div class="row" x-show="canEdit()">
                          <button class="btn btn-sm" @click.stop="saveEntry(r)">שמירה</button>
                          <button class="btn btn-sm btn-danger" @click.stop="removeEntry(r)">מחיקה</button>
                        </div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <template x-if="rows.length === 0"><p class="muted" style="text-align:center;">אין שורות להצגה.</p></template>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <script src="static/js/kav1.js"></script>
  <script>
    function locationsPage() {
      return {
        Kav1, me: null, brand: {}, loaded: false, enabled: false,
        maps: [], entries: [], mapId: null, selId: null, placing: false,
        projFilter: "", collapsed: {}, hint: "בחר שורה בטבלה, לחץ \"מקם\" ואז לחץ על המפה.",
        file: null, newMapName: "", msg: "", msgErr: false, entMsg: "",
        nProj: "", nEsc: "", nLoc: "",

        can(perm) { return !!(this.me && this.me.permissions && this.me.permissions.includes(perm)); },
        canEdit() { return this.can("locations.edit"); },

        get projects() { return [...new Set(this.entries.map(e => e.project))].sort(); },
        get selected() { return this.entries.find(e => e.id === this.selId) || null; },
        get mapEntries() { return this.entries.filter(e => e.map_id === this.mapId && e.x != null && (!this.projFilter || e.project === this.projFilter)); },
        get rows() {
          const list = this.entries.filter(e => !this.projFilter || e.project === this.projFilter);
          const groups = new Map();
          list.forEach(e => { if (!groups.has(e.project)) groups.set(e.project, []); groups.get(e.project).push(e); });
          const out = [];
          groups.forEach((members, k) => {
            out.push({ __g: true, key: k, title: k, count: members.length });
            if (!this.collapsed[k]) members.forEach(m => out.push(m));
          });
          return out;
        },

        async init() {
          try { this.me = await Kav1.me(); } catch (e) { location.href = "/login.html"; return; }
          if (!this.can("locations.view")) { location.href = "/index.html"; return; }
          try { this.brand = await Kav1.get("auth/branding"); } catch (e) {}
          const flags = await Kav1.extras.flags();
          this.enabled = !!flags.locations_enabled;
          if (this.enabled) await this.refresh();
          this.loaded = true;
        },

        async refresh() {
          try {
            [this.maps, this.entries] = await Promise.all([Kav1.get("locations/maps"), Kav1.get("locations/entries")]);
            if (!this.maps.some(m => m.id === this.mapId)) this.mapId = this.maps.length ? this.maps[0].id : null;
          } catch (e) { if (e.message !== "unauthorized") Kav1.toast(e.message, "error"); }
        },
        selectMap() { this.placing = false; },
        toggle(k) { this.collapsed = { ...this.collapsed, [k]: !this.collapsed[k] }; },
        select(id) { this.selId = id; this.placing = false; },

        onFile(ev) { this.file = ev.target.files[0] || null; },
        async uploadMap() {
          const f = this.file; if (!f) return;
          if (f.size > 15 * 1024 * 1024) { this.msgErr = true; this.msg = "הקובץ גדול מ-15MB"; return; }
          const name = (this.newMapName || f.name.replace(/\.[^.]+$/, "")).trim();
          try {
            const res = await fetch("/locations/maps?name=" + encodeURIComponent(name), { method: "POST", body: f, credentials: "same-origin" });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.detail || "ההעלאה נכשלה");
            this.msgErr = false; this.msg = "המפה הועלתה"; this.file = null; this.newMapName = "";
            await this.refresh(); this.mapId = data.id;
          } catch (e) { this.msgErr = true; this.msg = e.message; }
        },
        async renameMap() {
          const cur = this.maps.find(m => m.id === this.mapId); if (!cur) return;
          const n = window.prompt("שם חדש למפה:", cur.name); if (!n) return;
          try { await Kav1.put("locations/maps/" + this.mapId, { name: n }); await this.refresh(); } catch (e) { this.msgErr = true; this.msg = e.message; }
        },
        async deleteMap() {
          if (!this.mapId || !confirm("למחוק את המפה? הנקודות עליה יוסרו, השורות עצמן יישארו.")) return;
          try { await Kav1.del("locations/maps/" + this.mapId); await this.refresh(); } catch (e) { this.msgErr = true; this.msg = e.message; }
        },

        async addEntry() {
          this.entMsg = "";
          try {
            const r = await Kav1.post("locations/entries", { project: this.nProj, escort_name: this.nEsc, location_text: this.nLoc });
            this.nEsc = ""; this.nLoc = ""; await this.refresh(); this.selId = r.id;
          } catch (e) { this.entMsg = e.message; }
        },
        body(e, patch) { return { project: e.project, escort_name: e.escort_name, location_text: e.location_text, map_id: e.map_id, x: e.x, y: e.y, ...patch }; },
        async saveEntry(e, patch) {
          this.entMsg = "";
          try { await Kav1.put("locations/entries/" + e.id, this.body(e, patch || {})); Kav1.toast("נשמר"); await this.refresh(); }
          catch (er) { this.entMsg = er.message; }
        },
        async removeEntry(e) {
          if (!confirm("למחוק את השורה?")) return;
          try { await Kav1.del("locations/entries/" + e.id); await this.refresh(); } catch (er) { this.entMsg = er.message; }
        },

        startPlace() { this.placing = true; this.hint = "לחץ על המפה במקום הרצוי"; },
        async onStage(ev) {
          if (!this.placing || !this.selected) return;
          const r = this.$refs.img.getBoundingClientRect();
          if (!r.width) return;
          const x = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
          const y = Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height));
          this.placing = false; this.hint = "בחר שורה בטבלה, לחץ \"מקם\" ואז לחץ על המפה.";
          await this.saveEntry(this.selected, { map_id: this.mapId, x, y });
        },
        clearPoint() { if (this.selected) this.saveEntry(this.selected, { map_id: null, x: null, y: null }); },
      };
    }
  </script>
  <script src="static/vendor/alpine.min.js" defer></script>
</body>
</html>
