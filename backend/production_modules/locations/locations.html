<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שליטה ומיקומים</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1c2733; --muted:#5d6b7a; --line:#d5dce3; --accent:#1f6feb; --danger:#c62828; --ok:#2e7d32; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12181f; --card:#1b242e; --text:#e6edf3; --muted:#93a1b0; --line:#2d3946; --accent:#58a6ff; --danger:#ff6b6b; --ok:#56d364; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 16px; display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--line); background:var(--card); flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header a { color:var(--accent); margin-inline-start:auto; }
  main { padding:16px; display:grid; gap:16px; grid-template-columns:minmax(0,3fr) minmax(0,2fr); }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; }
  h2 { font-size:15px; margin:0 0 8px; }
  button,select,input { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); }
  button { cursor:pointer; } button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:var(--danger); } button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .muted { color:var(--muted); font-size:13px; } .msg { min-height:20px; font-size:13px; }
  .msg.err { color:var(--danger); } .msg.ok { color:var(--ok); }
  #stage { position:relative; display:inline-block; max-width:100%; border:1px solid var(--line); }
  #stage img { display:block; max-width:100%; height:auto; user-select:none; -webkit-user-drag:none; }
  #stage.placing { cursor:crosshair; outline:2px dashed var(--accent); }
  .dot { position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:var(--danger); border:2px solid #fff; box-shadow:0 0 0 1px #0006; }
  .dot.sel { background:var(--accent); width:18px; height:18px; margin:-9px 0 0 -9px; }
  .dot span { position:absolute; top:16px; right:-4px; white-space:nowrap; font-size:12px; background:#000b; color:#fff; padding:1px 5px; border-radius:4px; }
  table { width:100%; border-collapse:collapse; font-size:14px; } th,td { padding:5px; border-bottom:1px solid var(--line); text-align:start; }
  tr.sel { background:color-mix(in srgb,var(--accent) 15%,transparent); } td input { width:100%; }
  .group { font-weight:600; background:color-mix(in srgb,var(--muted) 15%,transparent); cursor:pointer; }
  #adminBox { display:none; } .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>שליטה ומיקומים</h1>
  <span id="who" class="muted"></span>
  <a href="/">חזרה למערכת</a>
</header>
<main>
  <section id="adminBox" style="grid-column:1/-1">
    <h2>הגדרות פיצ'רים (מנהל)</h2>
    <div class="row">
      <label><input type="checkbox" id="flagLoc"> הפעל את "שליטה ומיקומים"</label>
      <label><input type="checkbox" id="flagGroup"> קבץ את רשימת הקבלנים לפי פרויקט</label>
    </div>
    <div class="muted">כיבוי לא מוחק נתונים או מפות. כשהפיצ'ר כבוי הוא נעלם לכולם חוץ מהגדרה זו.</div>
    <div id="flagMsg" class="msg"></div>
  </section>

  <section id="disabledBox" class="hidden" style="grid-column:1/-1">הפיצ'ר "שליטה ומיקומים" אינו מופעל. פנה למנהל המערכת.</section>

  <section id="mapBox" class="hidden">
    <h2>מפה</h2>
    <div class="row">
      <select id="mapSel"></select>
      <button id="mapRename" class="edit">שנה שם</button>
      <button id="mapDel" class="edit danger">מחק מפה</button>
    </div>
    <div class="row edit">
      <input type="file" id="mapFile" accept="image/png,image/jpeg">
      <input id="mapName" placeholder="שם למפה">
      <button id="mapUp" class="primary">העלה מפה</button>
    </div>
    <div class="row edit">
      <button id="placeBtn" disabled>מקם נקודה לשורה שנבחרה</button>
      <button id="clearPt" disabled>הסר נקודה</button>
      <span class="muted" id="placeHint">בחר שורה בטבלה, לחץ "מקם", ואז לחץ על המפה.</span>
    </div>
    <div id="mapMsg" class="msg"></div>
    <div id="stage"><img id="mapImg" alt="" hidden></div>
    <div id="noMap" class="muted">אין מפה להצגה.</div>
  </section>

  <section id="entryBox" class="hidden">
    <h2>מלווים ומיקומים לפי פרויקט</h2>
    <div class="row">
      <select id="projFilter"><option value="">כל הפרויקטים</option></select>
      <label class="muted"><input type="checkbox" id="onlyMap"> רק על המפה הנוכחית</label>
    </div>
    <div class="row edit">
      <input id="nProj" placeholder="פרויקט" list="projList">
      <input id="nEsc" placeholder="מלווה">
      <input id="nLoc" placeholder="מיקום">
      <button id="addBtn" class="primary">הוסף מלווה ומיקום</button>
      <datalist id="projList"></datalist>
    </div>
    <div id="entMsg" class="msg"></div>
    <table><thead><tr><th>מלווה</th><th>מיקום</th><th>נקודה</th><th></th></tr></thead><tbody id="tbody"></tbody></table>
  </section>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const st = { perms: new Set(), flags: {}, maps: [], entries: [], selId: null, placing: false, collapsed: new Set() };
const api = async (method, url, body, raw) => {
  const opt = { method, credentials: "same-origin", headers: {} };
  if (raw) { opt.body = raw; } else if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch("/locations" + url, opt);
  if (!r.ok) { let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {} const e = new Error(typeof d === "string" ? d : JSON.stringify(d)); e.status = r.status; throw e; }
  return r.headers.get("content-type")?.includes("json") ? r.json() : r;
};
const say = (id, text, ok) => { const el = $(id); el.textContent = text || ""; el.className = "msg " + (text ? (ok ? "ok" : "err") : ""); };
const canEdit = () => st.perms.has("locations.edit");

async function init() {
  try {
    const me = await (await fetch("/auth/me", { credentials: "same-origin" })).json();
    if (!me.permissions) throw 0;
    st.perms = new Set(me.permissions); $("who").textContent = me.full_name || me.username || "";
  } catch (e) { location.href = "/"; return; }
  st.flags = await api("GET", "/flags");
  $("adminBox").style.display = st.perms.has("admin.settings") ? "block" : "none";
  $("flagLoc").checked = !!st.flags.locations_enabled; $("flagGroup").checked = !!st.flags.group_by_project;
  render();
}

function render() {
  const on = st.flags.locations_enabled && st.perms.has("locations.view");
  $("disabledBox").classList.toggle("hidden", !!st.flags.locations_enabled);
  $("mapBox").classList.toggle("hidden", !on); $("entryBox").classList.toggle("hidden", !on);
  document.querySelectorAll(".edit").forEach(el => el.classList.toggle("hidden", !canEdit()));
  if (on) refresh();
}

async function refresh() {
  [st.maps, st.entries] = await Promise.all([api("GET", "/maps"), api("GET", "/entries")]);
  const cur = $("mapSel").value;
  $("mapSel").replaceChildren(...st.maps.map(m => new Option(m.name, m.id)));
  if (cur && st.maps.some(m => String(m.id) === cur)) $("mapSel").value = cur;
  const projects = [...new Set(st.entries.map(e => e.project))].sort();
  const f = $("projFilter").value;
  $("projFilter").replaceChildren(new Option("כל הפרויקטים", ""), ...projects.map(p => new Option(p, p)));
  $("projFilter").value = projects.includes(f) ? f : "";
  $("projList").replaceChildren(...projects.map(p => { const o = document.createElement("option"); o.value = p; return o; }));
  drawMap(); drawTable();
}

function currentMapId() { return $("mapSel").value ? Number($("mapSel").value) : null; }

function drawMap() {
  const id = currentMapId(), img = $("mapImg");
  [...$("stage").querySelectorAll(".dot")].forEach(d => d.remove());
  $("noMap").hidden = id !== null; img.hidden = id === null;
  if (id === null) return;
  const src = "/locations/maps/" + id + "/image";
  if (!img.src.endsWith(src)) img.src = src;
  for (const e of st.entries) {
    if (e.map_id !== id || e.x == null) continue;
    const d = document.createElement("div"); d.className = "dot" + (e.id === st.selId ? " sel" : "");
    d.style.left = (e.x * 100) + "%"; d.style.top = (e.y * 100) + "%";
    const t = document.createElement("span"); t.textContent = e.project + (e.escort_name ? " · " + e.escort_name : ""); d.append(t);
    d.onclick = ev => { ev.stopPropagation(); select(e.id); };
    $("stage").append(d);
  }
}

function visibleEntries() {
  const p = $("projFilter").value, only = $("onlyMap").checked, mid = currentMapId();
  return st.entries.filter(e => (!p || e.project === p) && (!only || e.map_id === mid));
}

function drawTable() {
  const body = $("tbody"); body.replaceChildren();
  const byProj = new Map();
  for (const e of visibleEntries()) { if (!byProj.has(e.project)) byProj.set(e.project, []); byProj.get(e.project).push(e); }
  for (const [proj, rows] of byProj) {
    const g = document.createElement("tr"); g.className = "group";
    const gc = document.createElement("td"); gc.colSpan = 4;
    gc.textContent = (st.collapsed.has(proj) ? "▶ " : "▼ ") + proj + " (" + rows.length + ")";
    g.onclick = () => { st.collapsed.has(proj) ? st.collapsed.delete(proj) : st.collapsed.add(proj); drawTable(); };
    g.append(gc); body.append(g);
    if (st.collapsed.has(proj)) continue;
    for (const e of rows) body.append(entryRow(e));
  }
  if (!byProj.size) { const tr = body.insertRow(), td = tr.insertCell(); td.colSpan = 4; td.className = "muted"; td.textContent = "אין שורות."; }
  updateButtons();
}

function entryRow(e) {
  const tr = document.createElement("tr"); if (e.id === st.selId) tr.className = "sel";
  tr.onclick = () => select(e.id);
  const mk = (val) => { const td = tr.insertCell(); if (canEdit()) { const i = document.createElement("input"); i.value = val; i.maxLength = 200; td.append(i); return i; } td.textContent = val; return null; };
  const iE = mk(e.escort_name), iL = mk(e.location_text);
  const pt = tr.insertCell(); pt.textContent = e.x == null ? "—" : "✔";
  const act = tr.insertCell();
  if (canEdit()) {
    const save = document.createElement("button"); save.textContent = "שמור";
    save.onclick = ev => { ev.stopPropagation(); put(e, { escort_name: iE.value, location_text: iL.value }, "entMsg"); };
    const del = document.createElement("button"); del.textContent = "מחק"; del.className = "danger";
    del.onclick = async ev => { ev.stopPropagation(); if (!confirm("למחוק את השורה?")) return; try { await api("DELETE", "/entries/" + e.id); await refresh(); } catch (er) { say("entMsg", er.message); } };
    act.append(save, " ", del);
  }
  return tr;
}

async function put(e, patch, msgId) {
  const body = { project: e.project, escort_name: e.escort_name, location_text: e.location_text, map_id: e.map_id, x: e.x, y: e.y, ...patch };
  try { await api("PUT", "/entries/" + e.id, body); say(msgId, "נשמר", true); await refresh(); } catch (er) { say(msgId, er.message); }
}

function select(id) { st.selId = id; st.placing = false; $("stage").classList.remove("placing"); drawMap(); drawTable(); }
function updateButtons() {
  const sel = st.entries.find(e => e.id === st.selId);
  $("placeBtn").disabled = !sel || currentMapId() === null; $("clearPt").disabled = !sel || sel.x == null;
}

$("mapSel").onchange = () => { drawMap(); drawTable(); };
$("projFilter").onchange = drawTable; $("onlyMap").onchange = drawTable;
$("placeBtn").onclick = () => { st.placing = true; $("stage").classList.add("placing"); say("mapMsg", "לחץ על המפה במקום הרצוי", true); };
$("stage").onclick = async ev => {
  if (!st.placing) return;
  const sel = st.entries.find(e => e.id === st.selId), img = $("mapImg"), r = img.getBoundingClientRect();
  if (!sel || !r.width) return;
  const x = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)), y = Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height));
  st.placing = false; $("stage").classList.remove("placing");
  await put(sel, { map_id: currentMapId(), x, y }, "mapMsg");
};
$("clearPt").onclick = () => { const sel = st.entries.find(e => e.id === st.selId); if (sel) put(sel, { map_id: null, x: null, y: null }, "mapMsg"); };
$("addBtn").onclick = async () => {
  try { const r = await api("POST", "/entries", { project: $("nProj").value, escort_name: $("nEsc").value, location_text: $("nLoc").value });
    $("nEsc").value = ""; $("nLoc").value = ""; say("entMsg", "נוסף", true); await refresh(); select(r.id); } catch (er) { say("entMsg", er.message); }
};
$("mapUp").onclick = async () => {
  const f = $("mapFile").files[0], name = $("mapName").value.trim() || (f && f.name.replace(/\.[^.]+$/, ""));
  if (!f) return say("mapMsg", "בחר קובץ PNG או JPEG");
  if (f.size > 15 * 1024 * 1024) return say("mapMsg", "הקובץ גדול מ-15MB");
  try { const r = await api("POST", "/maps?name=" + encodeURIComponent(name), undefined, f);
    say("mapMsg", "המפה הועלתה", true); await refresh(); $("mapSel").value = r.id; drawMap(); drawTable(); } catch (er) { say("mapMsg", er.message); }
};
$("mapRename").onclick = async () => {
  const id = currentMapId(); if (id === null) return; const n = prompt("שם חדש למפה:", $("mapSel").selectedOptions[0].text); if (!n) return;
  try { await api("PUT", "/maps/" + id, { name: n }); await refresh(); $("mapSel").value = id; } catch (er) { say("mapMsg", er.message); }
};
$("mapDel").onclick = async () => {
  const id = currentMapId(); if (id === null) return;
  if (!confirm("למחוק את המפה? הנקודות עליה יוסרו, השורות עצמן יישארו.")) return;
  try { await api("DELETE", "/maps/" + id); await refresh(); } catch (er) { say("mapMsg", er.message); }
};
async function saveFlags() {
  try { st.flags = await api("PUT", "/flags", { locations_enabled: $("flagLoc").checked, group_by_project: $("flagGroup").checked }); say("flagMsg", "נשמר", true); render(); }
  catch (er) { say("flagMsg", er.message); }
}
$("flagLoc").onchange = saveFlags; $("flagGroup").onchange = saveFlags;
init();
</script>
</body>
</html>
